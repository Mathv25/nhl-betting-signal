name: Lite NHL — regler les paris

# Gratuit: api-web.nhle.com, aucun credit Odds API.
on:
  schedule:
    - cron: '0 11 * * *'   # 7h ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lite-write
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.31.0
      - name: Regler, commiter et pousser
        run: |
          git config --global user.name "NHL Bot"
          git config --global user.email "bot@nhl.local"
          python3 lite/bets.py pending || { echo "aucun pari en attente"; exit 0; }
          for essai in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python3 lite/bets.py grade || exit 1
            python3 lite/bets.py stats
            git add data/lite_bets.csv docs/lite/bets.json
            git diff --staged --quiet && exit 0
            git commit -m "Lite NHL reglement $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:main && exit 0
            echo "push refuse (essai $essai), on recommence sur le dernier main"
            sleep 5
          done
          exit 1
