name: Notation des paris — gratuit, sans Odds API

# Le seul job automatique qui reste. Il ne touche PAS a The Odds API: il lit
# les scores sur statsapi.mlb.com, qui est gratuit et sans quota. Sans lui,
# couper les crons gelerait l'onglet Performance — les paris resteraient en
# attente indefiniment et le yield ne bougerait plus.
on:
  schedule:
    - cron: '0 15 * * *'   # 11h ET — la veille est terminee partout
  workflow_dispatch:
    inputs:
      date:
        description: "Date a noter (AAAA-MM-JJ, vide = hier)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  noter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer dependances
        run: pip install -r requirements.txt

      - name: Resoudre les paris
        env:
          CIBLE: ${{ inputs.date }}
        run: |
          cd src
          if [ -n "$CIBLE" ]; then
            python backtester.py "$CIBLE"
          else
            python backtester.py "$(TZ=America/Toronto date -d 'yesterday' +%Y-%m-%d)"
          fi

      - name: Commit
        run: |
          git config --global user.name "NHL Bot"
          git config --global user.email "bot@nhl.local"
          git add docs/
          git diff --staged --quiet || git commit -m "Notation $(date +'%Y-%m-%d')"
          git pull --rebase -X theirs origin main || true
          git push || true
