name: NHL Signal - Actualisation toutes les 2h
on:
  # Plus de cron: le signal se declenche a la demande, par le bouton
  # Actualiser du dashboard ou depuis l'onglet Actions. Le cron horaire
  # depensait environ 520 credits Odds API par jour pour regenerer une
  # page que personne ne regardait la plupart du temps.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Archiver signal si changement de jour ET
        run: |
          if [ -f docs/signal.json ]; then
            mkdir -p docs/archive
            SIGNAL_DATE=$(python3 -c "import json; d=json.load(open('docs/signal.json')); print(d.get('date',''))" 2>/dev/null || echo "")
            TODAY_ET=$(TZ=America/Toronto date +%Y-%m-%d)
            if [ -n "$SIGNAL_DATE" ] && [ "$SIGNAL_DATE" != "$TODAY_ET" ]; then
              ARCHIVE=docs/archive/signal_${SIGNAL_DATE}.json
              if [ ! -f "$ARCHIVE" ]; then
                cp docs/signal.json "$ARCHIVE"
                echo "Archive cree: $ARCHIVE"
              else
                echo "Archive existe deja: $ARCHIVE"
              fi
            fi
          fi
      - name: Resoudre bets de la veille si nouvelle journee ET
        run: |
          SIGNAL_DATE=$(python3 -c "import json; d=json.load(open('docs/signal.json')); print(d.get('date',''))" 2>/dev/null || echo "")
          TODAY_ET=$(TZ=America/Toronto date +%Y-%m-%d)
          if [ -n "$SIGNAL_DATE" ] && [ "$SIGNAL_DATE" != "$TODAY_ET" ]; then
            echo "Nouvelle journee ET ($SIGNAL_DATE -> $TODAY_ET): resolution des bets"
            cd src && python backtester.py "$SIGNAL_DATE"
          else
            echo "Meme journee ET ($TODAY_ET): pas de resolution"
          fi
      - name: Generer le signal
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_WORKFLOW_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN }}
        run: |
          cd src
          python signal.py
      - name: Sauvegarder bets du signal courant comme pending
        run: |
          cd src && python backtester.py --save-pending
      - name: Commit et push
        run: |
          git config --global user.name "NHL Bot"
          git config --global user.email "bot@nhl.local"
          # data/predictions.csv est aussi ecrit par record_prediction.yml
          # (cotes saisies). On le met de cote, on rattrape main, puis on le
          # FUSIONNE ligne par ligne: jamais de resolution -X theirs sur ce
          # fichier, elle effacerait une saisie faite pendant le run.
          if [ -f data/predictions.csv ]; then
            cp data/predictions.csv /tmp/pred_run.csv
            git checkout -- data/predictions.csv 2>/dev/null || rm -f data/predictions.csv
          fi
          # Tout docs/, pas une liste: enumerer les fichiers fait echouer
          # le run des qu'un module en ecrit un nouveau — apres avoir
          # depense les requetes API. C'est ce qui est arrive le 15
          # septembre avec docs/nfl_signals.json, un mardi, jour de
          # releve NFL: trois runs perdus a l'etape git.
          git add docs/
          git diff --staged --quiet || git commit -m "Signal refresh $(date +'%Y-%m-%d %H:%M')"
          # Si l'arbre n'est pas propre ici, le rebase echouera avec un message
          # qui ne dit pas QUEL fichier bloque. On l'affiche.
          if [ -n "$(git status --porcelain -- . ':!data')" ]; then
            echo "Arbre non propre avant le rebase:"
            git status --porcelain
          fi
          # Rebase sur remote avec strategy "theirs" pour les conflits sur fichiers bot
          git pull --rebase -X theirs origin main || (git rebase --abort && git pull --ff-only origin main)
          if [ -f /tmp/pred_run.csv ]; then
            mkdir -p data
            python3 src/predictions_log.py merge /tmp/pred_run.csv data/predictions.csv prediction
            git add data/
            git diff --staged --quiet || git commit -m "Journal des predictions $(date +'%Y-%m-%d %H:%M')"
          fi
          git push || (git pull --rebase -X theirs origin main && git push)
