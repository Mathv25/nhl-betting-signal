name: CLV Capture — Cotes de fermeture

on:
  # Plus de cron. Attention: la cote de FERMETURE doit etre relevee
  # juste avant les matchs (vers 19h ET). Lancee plus tard, elle ne
  # mesure plus rien. C'est le seul job dont le moment compte vraiment.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-clv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dependances
        run: pip install -r requirements.txt

      - name: Capturer les cotes de fermeture (CLV)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          TODAY_ET=$(TZ=America/Toronto date +%Y-%m-%d)
          echo "Capture CLV pour $TODAY_ET"
          cd src && python clv_capture.py "$TODAY_ET"

      - name: Commit CLV
        run: |
          git config --global user.name "NHL Bot"
          git config --global user.email "bot@nhl.local"
          # Tout docs/, pas une liste: enumerer les fichiers fait echouer
          # le run des qu'un module en ecrit un nouveau — apres avoir
          # depense les requetes API. C'est ce qui est arrive le 15
          # septembre avec docs/nfl_signals.json, un mardi, jour de
          # releve NFL: trois runs perdus a l'etape git.
          git add docs/
          git diff --staged --quiet || git commit -m "CLV capture $(date +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main || true
          git push || true
