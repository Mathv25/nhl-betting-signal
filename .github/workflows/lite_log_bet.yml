name: Lite NHL — enregistrer un pari

# Declenche par « Enregistrer » de docs/lite/. Le pari arrive en JSON dans
# l'input `payload` et n'est JAMAIS interpole dans le shell: il passe par la
# variable d'environnement PAYLOAD.
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Pari JSON (date, away, home, market, selection, line, player, odds, stake, p, source)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lite-write
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests==2.31.0
      - name: Ecrire, commiter et pousser
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          git config --global user.name "NHL Bot"
          git config --global user.email "bot@nhl.local"
          for essai in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python3 lite/bets.py add || exit 1
            python3 lite/bets.py stats
            git add data/lite_bets.csv docs/lite/bets.json
            git diff --staged --quiet && exit 0
            git commit -m "Lite NHL pari $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:main && exit 0
            echo "push refuse (essai $essai), on recommence sur le dernier main"
            sleep 5
          done
          exit 1
