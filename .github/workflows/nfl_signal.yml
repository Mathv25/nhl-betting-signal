name: NFL Signal — releve hebdomadaire

# Trois fenetres par semaine, pas une de plus: le quota Odds API sert d'abord
# au MLB et au NHL, qui jouent tous les jours. Les heures sont en UTC; le
# module revalide la fenetre en heure ET de son cote, donc un decalage de cron
# ne declenche pas de depense hors fenetre.
on:
  schedule:
    - cron: '0 14 * * 2'   # mardi 10h ET — ouverture des lignes
    - cron: '0 14 * * 5'   # vendredi 10h ET — mouvement de mi-semaine
    - cron: '0 14 * * 0'   # dimanche 10h ET — lignes finales + cotes de fermeture
  workflow_dispatch:
    inputs:
      force:
        description: "Relever les cotes hors fenetre (match en semaine, test)"
        type: boolean
        default: false
      props_within:
        description: "Props: ne scanner que les matchs des N prochaines heures (vide = tous)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  nfl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer dependances
        run: pip install -r requirements.txt

      - name: Relever les cotes NFL
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NFL_FORCE: ${{ inputs.force }}
          NFL_PROPS_WITHIN: ${{ inputs.props_within }}
        run: cd src && python nfl_run.py

      - name: Commit
        run: |
          git config --global user.name "NHL Bot"
          git config --global user.email "bot@nhl.local"
          git add docs/nfl_signals.json docs/nfl_props.json docs/bets.json docs/odds_usage.json
          git diff --staged --quiet || git commit -m "NFL $(date +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase -X theirs origin main || true
          git push || true
